<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HPOD-Classifier · DRAM 晶圆缺陷诊断</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="1.25" />
        <circle cx="16" cy="16" r="2" fill="currentColor" />
        <line x1="16" y1="1.5" x2="16" y2="6" stroke="currentColor" stroke-width="1.25" />
        <line x1="16" y1="26" x2="16" y2="30.5" stroke="currentColor" stroke-width="1.25" />
        <line x1="1.5" y1="16" x2="6" y2="16" stroke="currentColor" stroke-width="1.25" />
        <line x1="26" y1="16" x2="30.5" y2="16" stroke="currentColor" stroke-width="1.25" />
      </svg>
      <span class="brand-name">HPOD-Classifier</span>
      <span class="brand-sub">DRAM 晶圆缺陷诊断</span>
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-view="overview">概览</button>
      <button class="nav-btn" data-view="diagnose">诊断</button>
    </nav>
    <div class="topbar-right">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">加载中…</span>
    </div>
  </header>

  <main>
    <!-- 概览 -->
    <section id="view-overview" class="view">
      <div class="view-head">
        <div>
          <h1 class="view-title">模型概览</h1>
          <p class="view-desc">当前协议、部署状态与数据覆盖范围</p>
        </div>
        <span class="badge" id="ov-ready">—</span>
      </div>

      <div class="card-grid" id="ov-params"></div>

      <div class="panel">
        <div class="panel-head">
          <h2>训练曲线</h2>
          <span class="panel-meta" id="ov-epochs"></span>
        </div>
        <div class="chart-row">
          <div class="chart-box">
            <div class="chart-title">Loss</div>
            <svg id="chart-loss" role="img" aria-label="训练损失曲线"></svg>
          </div>
          <div class="chart-box">
            <div class="chart-title">Accuracy</div>
            <svg id="chart-acc" role="img" aria-label="准确率曲线"></svg>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>类别分布</h2></div>
        <div class="dist-layout">
          <div class="dist-stats" id="ov-dist-stats"></div>
          <svg id="chart-dist" role="img" aria-label="类别样本分布"></svg>
        </div>
      </div>
    </section>

    <!-- 诊断 -->
    <section id="view-diagnose" class="view hidden">
      <div class="view-head">
        <div>
          <h1 class="view-title">缺陷诊断</h1>
          <p class="view-desc">分类证据、未知拒识与相似案例复核</p>
        </div>
        <div class="seg" id="diag-mode">
          <button class="seg-btn active" data-mode="single">单图</button>
          <button class="seg-btn" data-mode="batch">批量</button>
        </div>
      </div>

      <!-- 单图模式 -->
      <div class="diag-layout" id="diag-single">
        <div class="diag-left">
          <div class="panel">
            <div class="panel-head"><h2>图片来源</h2></div>
            <div class="source-row">
              <label class="btn">上传图像<input type="file" id="file-input" accept="image/*" hidden /></label>
            </div>
            <div class="preview" id="diag-preview">
              <div class="empty">选择或上传一张 ROI 图像</div>
            </div>
            <div class="preview-meta" id="diag-preview-meta"></div>
          </div>
        </div>
        <div class="diag-right">
          <div class="panel result-panel" id="diag-result">
            <div class="empty">诊断结果将显示在这里</div>
          </div>
        </div>
      </div>

      <!-- 批量模式 -->
      <div class="diag-layout hidden" id="diag-batch">
        <div class="diag-left">
          <div class="panel">
            <div class="panel-head">
              <h2>选择图像</h2>
              <span class="panel-meta" id="batch-count">已选 0 张</span>
            </div>
            <div class="toolbar compact">
              <input type="search" id="batch-search" placeholder="搜索文件名…" />
              <select id="batch-defect"><option value="">全部缺陷</option></select>
            </div>
            <label class="pick-all"><input type="checkbox" id="batch-select-all" /> 全选当前列表</label>
            <div class="pick-list" id="batch-list"></div>
            <div class="load-more"><button class="btn ghost" id="batch-more">加载更多</button></div>
            <div class="batch-actions">
              <button class="btn primary" id="btn-batch-run">批量诊断</button>
            </div>
          </div>
        </div>
        <div class="diag-right">
          <div class="panel result-panel" id="batch-result">
            <div class="empty">批量诊断结果将显示在这里</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <dialog class="image-dialog" id="batch-image-dialog">
    <div class="image-dialog-head">
      <div>
        <strong id="batch-image-title">图像详情</strong>
        <span id="batch-image-subtitle"></span>
      </div>
      <button class="icon-btn" id="batch-image-close" aria-label="关闭图像详情" title="关闭">×</button>
    </div>
    <div class="image-dialog-body">
      <img id="batch-image-preview" alt="批量诊断图像详情" />
      <div class="image-error hidden" id="batch-image-error">图像加载失败</div>
    </div>
  </dialog>

  <footer class="statusbar">
    <span id="footer-model">模型: —</span>
    <span class="dot-sep"></span>
    <span id="footer-classes">— 类</span>
    <span class="dot-sep"></span>
    <span id="footer-device">设备: —</span>
  </footer>

  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
